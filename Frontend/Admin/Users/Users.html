<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../admin.css">
  <title>Users | PawCare Admin</title>
</head>
<body data-page="users">
  <div class="admin-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <header class="page-header">
        <div>
          <h1>Users</h1>
          <p>Everyone registered on PawCare.</p>
        </div>
      </header>

      <section class="card">
        <div class="toolbar">
          <input type="text" id="searchInput" class="input search" placeholder="Search by name or email">
          <select id="roleFilter" class="input">
            <option value="all">All roles</option>
            <option value="owner">Owners</option>
            <option value="admin">Admins</option>
          </select>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Name</th><th>Role</th><th>Pets</th><th>Joined</th><th>Status</th><th></th></tr>
            </thead>
            <tbody id="usersBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="../admin-data.js"></script>
  <script src="../admin-common.js"></script>
  <script src="Users.js"></script>
</body>
</html>
