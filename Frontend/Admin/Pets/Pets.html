<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../admin.css">
  <title>Pets | PawCare Admin</title>
</head>
<body data-page="pets">
  <div class="admin-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <header class="page-header">
        <div>
          <h1>Pets</h1>
          <p>All pets added by owners.</p>
        </div>
      </header>

      <section class="card">
        <div class="toolbar">
          <input type="text" id="searchInput" class="input search" placeholder="Search by pet, breed or owner">
          <select id="speciesFilter" class="input">
            <option value="all">All species</option>
            <option value="Dog">Dogs</option>
            <option value="Cat">Cats</option>
            <option value="Rabbit">Rabbits</option>
            <option value="Bird">Birds</option>
          </select>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Pet</th><th>Species</th><th>Owner</th><th>Age</th><th>Weight</th><th>Health</th><th></th></tr>
            </thead>
            <tbody id="petsBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="../admin-data.js"></script>
  <script src="../admin-common.js"></script>
  <script src="Pets.js"></script>
</body>
</html>
