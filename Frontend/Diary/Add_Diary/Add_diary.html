            <main class="main" >

                        <h1 class="greeting">Pet Diary</h1>

                        </div>
                        <a href="add-pet.html" class="btn btn-primary">+ New entry</a>
                </header>


        <div class="add-diary-page">

            <h1 class="add-diary-title">Add a diary entry</h1>
            <p class="add-diary-subtitle">Tell us about your new family member.</p>

            <form class="add-diary-card" action="#" method="post">

                <div class="add-diary-photo">
                <div class="add-diary-photo-frame">
                
                    <img src="../../Images/dogcat.jpeg" alt="Default pet avatar: a kitten and a puppy" />
                </div>
                <input class="add-diary-visually-hidden" type="file" id="add-diary-photo" name="photo" accept="image/*" />
                <label class="add-diary-photo-link" for="add-diary-photo">Upload pet photo</label>
                </div>

                <div class="add-diary-form">
                <div class="add-diary-grid">

                    <div class="add-diary-field">
                    <label class="add-diary-label" for="add-diary-title">Title</label>
                    <input class="add-diary-input" type="text" id="diary-title" name="name" placeholder="Max Learned a new trick!" />
                    </div><br>

                    <div class="add-diary-field">
                    <label class="add-diary-label" for="users-pet">pet</label>
                    <select class="add-diary-select" id="add-diary-species" name="users-pet">
                        <option selected>MAX</option>
                        <option>OGGY</option>
                        <option>Olivia</option>
                        <option>Fluffy</option>
                        <option>Other</option>
                    </select>
                    </div>


                    <div class="add-diary-field">
                    <label class="add-diary-label" for="add-diary-dob">Date of birth</label>
                    <input class="add-diary-input" type="date" id="add-diary-dob" name="dob" value="2023-05-12" />
                    </div>


                    

                    <div class="add-diary-field">
                    <label class="add-diary-label" for="add-diary-mood">How was the day?</label>
                    <select name="pet_mood" id="add-diary-mood">
                        <option value="happy">Happy</option>
                        <option value="excited">Excited</option>
                        <option value="relaxed">Relaxed</option>
                        <option value="playful">Playful</option>
                        <option value="tired">Tired</option>
                        <option value="unwell">Unwell</option>
                    </select>
                    </div>

                </div>

                <div class="add-diary-field add-diary-field-wide">
                    <label class="add-diary-label" for="add-diary-desc">What Happened?</label>
                   <textarea class="add-diary-input" id="add-diary-desc" rows="122" name="description">A very good boy who loves the park.</textarea>   </div>

                <div class="add-diary-actions">
                    <button class="add-diary-btn add-diary-btn-primary" type="submit">Save Diary</button>
                    <a class="add-diary-btn add-diary-btn-ghost" href="#">Cancel</a>
                </div>
                </div>

            </form>
            </div>
