<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Login</title>
</head>
<body>
    <main class="main-container">
        <div id="left" class=" left">
                <div class="left-content flex-col">
                    <div class="logo-container">
                        <img src="" alt="">
                        <div>
                            <h1 class="headings" >Paw<span>fect</span></h1>
                            <p>Pet Care & Wellness</p>
                        </div>
                    </div>
                    <p class="handwritten-line">Helthier pets . happier lives</p>
                    <h1 class="headings">Welcome Back</h1>
                    <p>Everything your pet needs, in one place. Pick up right where you left off.</p>
                    <div class=" ex-info"><p class="handwritten-line">Happy pet makea happy homes</p></div>
                </div>    
        </div>




        <div id="right" class=" right flex-col">
            <div class="right-content flex-col">

                <h1 class="headings">Log in</h1>
                <p>Welcome back to PawCare</p>
                
                <form action="" class="flex-col login-form">
                    <div class="flex-col">
                        <label for="email">Email</label>
                        <input type="email" name="email" id="email">
                    </div>
                    <div class="flex-col">
                        <label for="password">Password</label>
                        <input type="password" name="password" id="password">
                    </div>
                    <div class="login-options">
                        <div class="login-options-remember">
                            <input type="checkbox" name="remember-me" id="remember-me">
                            <label for="remember-me"> Remember me</label>
                        </div>
                        <a href="forgot_password.html">Forgot Password</a>
                    </div>
                    <button class="login-btn">Login -> </button>
                    <span style="text-align: center;margin-top: 10px;">New here? <a href="registration.html">Create an account</a></span>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
