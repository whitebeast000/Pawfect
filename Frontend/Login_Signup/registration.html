<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="../Pages.css" media="(max-width: 1200px)">
    <script src="registration.js" defer></script>
    <title>Registration</title>
</head>
<body>
    <main class="main-container">
        <div id="left" class=" left">
                <div class="left-content flex-col">
                    <div class="logo-container">
                        <img src="" alt="">
                        <div>
                            <h1 class="headings" >Paw<span>fect</span></h1>
                            <p>Care for them Love them always</p>
                        </div>
                    </div>
                    <p class="handwritten-line">Helthier pets . happier lives</p>
                    <h1 class="headings">Join The Pack</h1>
                    <p>Track health, manage vet visits and never left a dose</p>
                    <div class=" ex-info"><p class="handwritten-line">Happy pet makea happy homes</p></div>
                </div>    
        </div>




        <div id="right" class=" right flex-col">
            <div class="right-content flex-col">

                <h1 class="headings">Create account</h1>
                <p>Welcome back to PawCare</p>
                
                <form action="" class="flex-col login-form" id="registration-form" novalidate>
                    <div class="flex-col">
                        <label for="name">FullName</label>
                        <input type="text" name="name" id="name" autocomplete="name" required>
                    </div>
                    <div class="flex-col">
                        <label for="email">Email</label>
                        <input type="email" name="email" id="email" autocomplete="email" required>
                    </div>
                    <div class="flex-col">
                        <label for="password">Password</label>
                        <input type="password" name="password" id="password" autocomplete="new-password" required>
                    </div>
                    <div class="flex-col">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" name="confirm-password" id="confirm-password" autocomplete="new-password" required>
                    </div>
                    <div class="login-options">
                        <div class=".login-options-remember">
                            <input type="checkbox" name="remember-me" id="remember-me">
                            <label for="remember-me"> Remember me</label>
                        </div>
                        <a href="forgot_password.html">Forgot Password</a>
                    </div>
                    <p class="auth-message" id="registration-message" role="status" aria-live="polite" hidden></p>
                    <button class="register-btn" type="submit">Create Account -> </button>
                    <span style="text-align: center;margin-top: 10px;">Already registered? <a href="login.html">login</a></span>
                </form>
            </div>
        </div>
    </main>
    <script src="../navbar.js"></script>
</body>
</html>
