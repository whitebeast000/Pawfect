<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="../Pages.css" media="(max-width: 1200px)">
    <script src="password_reset.js" defer></script>
    <title>Choose a New Password</title>
</head>
<body data-reset-step="password">
    <main class="main-container">
        <div id="left" class=" left">
                <div class="left-content flex-col">
                      <div class="logo">
                        <img src="Pawfect_Logo.png" alt="">
                    </div>
                    <p class="handwritten-line">Helthier pets . happier lives</p>
                    <h1 class="headings">Welcome Back</h1>
                    <p>Everything your pet needs, in one place. Pick up right where you left off.</p>
                    <div class=" ex-info"><p class="handwritten-line">Happy pet makea happy homes</p></div>
                
                <div class="main_image">
                             <img src="../Images/mainImage.jfif" alt="" >
                         </div>

                </div>    

        </div>

        <div class="right flex-col">
            <div class="right-content flex-col">
                <h1 class="headings">New Password</h1>
                <p>Choose a password with at least 8 characters.</p>
                <p class="otp-demo-note">Frontend-only demo: this is not secure authentication.</p>

                <form class="flex-col login-form" id="new-password-form" novalidate>
                    <div class="flex-col">
                        <label for="new-password">New Password</label>
                        <input type="password" name="new-password" id="new-password" autocomplete="new-password" required>
                    </div>
                    <div class="flex-col">
                        <label for="confirm-new-password">Confirm New Password</label>
                        <input type="password" name="confirm-new-password" id="confirm-new-password" autocomplete="new-password" required>
                    </div>
                    <p class="auth-message" id="new-password-message" role="status" aria-live="polite" hidden></p>
                    <button class="login-btn" type="submit">Save New Password</button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
