<body data-page="reschedule">
    <div class="main-container">
        <div class="left">

            <nav class="nav-section">
                <div class="logo">
                    <img src="Pawfect_Logo.png" alt="PawCare logo">

                <div class="nav-list">
                    <ul>

                        <li class="nav-list-item"><i class="bi bi-plus-lg"></i><a href="../Health/Health.html">Health</a></li>
                        <li class="nav-list-item active"><i class="bi bi-clock"></i><a href="../Appointments/Appointments.html">Appointments</a></li>
                        <li class="nav-list-item"><i class="bi bi-check-lg"></i><a href="../DailyCare/DailyCare.html">Daily Care</a></li>
                        <li class="nav-list-item"><i class="bi bi-dot"></i><a href="../Reminders/Reminders.html">Reminders</a></li>

            <div>
                <div class="left-bottom">
                    <img src="../Images/nav_bottom.jfif" alt="">
                    <h3>Need advice?</h3>
                    <p>Read our pet care guide</p>
                </div>
                <button class="logout-btn nav-list-item"><i class="bi bi-arrow-right"></i><span>Log out</span></button>
            </div>

        </div>

        <div class="right">
<main class="main">

  <header class="page-head">
    <h1 class="page-title">Reschedule appointment</h1>
    <p class="page-sub">Choose a new date and time for this visit.</p>
  </header>

  <article class="card page-narrow" id="rescheduleCard">
    <h2 class="card-title">Appointment details</h2>

    <form class="book-form" id="rescheduleForm" novalidate>

      <div class="field">
        <br>
        <label for="pet">Pet</label>
        <select id="pet" name="pet" disabled>
          <option value="" disabled selected>Select pet</option>
            <option value="Max">Max</option>
            <option value="Luna">Luna</option>
            <option value="Coco">Coco</option>
        </select>
      </div>

      <div class="field">
        <label for="vet">Veterinarian</label>
        <select id="vet" name="vet" required>
          <option value="" disabled selected>Select veterinarian</option>
            <option value="Dr. Ahmed">Dr. Ahmed</option>
            <option value="Dr. Sara">Dr. Sara</option>
        </select>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="date">Date</label>
          <input type="date" id="date" name="date" required>
        </div>
        <div class="field">
          <label for="time">Time</label>
          <input type="time" id="time" name="time" required>
        </div>
      </div>

      <div class="field">
        <label for="reason">Reason</label>
        <input type="text" id="reason" name="reason" placeholder="e.g. Regular checkup" maxlength="120" required>
      </div>

      <button type="submit" class="btn-book" id="saveBtn">Save changes</button>

      <div class="btn-row">
        <button type="button" class="btn-outline btn-outline--danger" id="cancelBtn">Cancel appointment</button>
        <a href="Appointments.html" class="btn-outline">Back to appointments</a>
      </div>

      <p class="form-message" id="formMessage" role="status"></p>
    </form>
  </article>
</main>
        </div>

    </div>
    <script src="Appointments.js"></script>
    <script src="../navbar.js"></script>
</body>
</html>
