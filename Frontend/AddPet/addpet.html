<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <script src="../navbar.js" defer></script>

</head>

<body>
    <div class="main-container">

        <div class="left">
            <nav class="nav-section">
                <div class="logo">
                    <img src="Pawfect_Logo.png" alt="Pawfect logo">
                </div>

                <div class="nav-list">
                    <ul>
                        <li class="nav-list-item">
                            <i class="bi bi-house-fill"></i>
                            <a href="../Dashboard/Dashboard.html">Dashboard</a>
                        </li>

                        <li class="nav-list-item">
                            <i class="bi bi-heart-fill"></i>
                            <a href="../MyPet/MyPet.html">My Pets</a>
                        </li>

                        <li class="nav-list-item">
                            <i class="bi bi-plus-lg"></i>
                            <a href="../Health/Health.html">Health</a>
                        </li>

                        <li class="nav-list-item">
                            <i class="bi bi-clock"></i>
                            <a href="../Appointments/Appointments.html">Appointments</a>
                        </li>

                        <li class="nav-list-item">
                            <i class="bi bi-check-lg"></i>
                            <a href="../DailyCare/DailyCare.html">Daily Care</a>
                        </li>

                        <li class="nav-list-item">
                            <i class="bi bi-dot"></i>
                            <a href="../Reminders/Reminders.html">Reminders</a>
                        </li>

                        <li class="nav-list-item">
                            <i class="bi bi-journal-text"></i>
                            <a href="../Diary/Diary.html">Diary</a>
                        </li>

                        <li class="nav-list-item">
                            <i class="bi bi-list"></i>
                            <a href="../Articles/Articles.html">Articles</a>
                        </li>

                        <li class="nav-list-item">
                            <i class="bi bi-person-circle"></i>
                            <a href="../Profile/Profile.html">Profile</a>
                        </li>
                    </ul>
                </div>
            </nav>

            <div>
                <div class="left-bottom">
                    <img src="../Images/nav_bottom.jfif" alt="Pet care advice">
                    <h3>Need advice?</h3>
                    <p>Read our pet care guide</p>
                </div>

                <button class="logout-btn nav-list-item" type="button">
                    <i class="bi bi-arrow-right"></i>
                    <span>Log out</span>
                </button>
            </div>
        </div>

        <div class="right">
            <main>
                <div class="addpet-page">

                    <h1 class="addpet-title">Add a pet</h1>
                    <p class="addpet-subtitle">
                        Tell us about your new family member.
                    </p>

                    <form class="addpet-card" action="#" method="post">

                        <div class="addpet-photo">
                            <div class="addpet-photo-frame">
                                <img src="../Images/avatar.jpg" alt="Pet avatar">
                            </div>

                            <input
                                class="addpet-visually-hidden"
                                type="file"
                                id="addpet-photo"
                                name="photo"
                                accept="image/*"
                            >

                            <label class="addpet-photo-link" for="addpet-photo">
                                Upload pet photo
                            </label>
                        </div>

                        <div class="addpet-form">
                            <div class="addpet-grid">

                                <div class="addpet-field">
                                    <label class="addpet-label" for="addpet-name">Name</label>
                                    <input class="addpet-input" type="text" id="addpet-name" name="name" value="Max">
                                </div>

                                <div class="addpet-field">
                                    <label class="addpet-label" for="addpet-species">Species</label>
                                    <select class="addpet-select" id="addpet-species" name="species">
                                        <option selected>Dog</option>
                                        <option>Cat</option>
                                        <option>Rabbit</option>
                                        <option>Bird</option>
                                        <option>Other</option>
                                    </select>
                                </div>

                                <div class="addpet-field">
                                    <label class="addpet-label" for="addpet-breed">Breed</label>
                                    <input class="addpet-input" type="text" id="addpet-breed" name="breed" value="Golden Retriever">
                                </div>

                                <div class="addpet-field">
                                    <label class="addpet-label" for="addpet-gender">Gender</label>
                                    <select class="addpet-select" id="addpet-gender" name="gender">
                                        <option selected>Male</option>
                                        <option>Female</option>
                                    </select>
                                </div>

                                <div class="addpet-field">
                                    <label class="addpet-label" for="addpet-dob">Date of birth</label>
                                    <input class="addpet-input" type="date" id="addpet-dob" name="dob" value="2023-05-12">
                                </div>

                                <div class="addpet-field">
                                    <label class="addpet-label" for="addpet-weight">Weight (kg)</label>
                                    <input class="addpet-input" type="number" id="addpet-weight" name="weight" value="24" min="0" step="0.1">
                                </div>

                                <div class="addpet-field">
                                    <label class="addpet-label" for="addpet-colour">Colour</label>
                                    <input class="addpet-input" type="text" id="addpet-colour" name="colour" value="Golden">
                                </div>

                                <div class="addpet-field">
                                    <label class="addpet-label" for="addpet-microchip">Microchip no.</label>
                                    <input class="addpet-input" type="text" id="addpet-microchip" name="microchip" placeholder="—">
                                </div>

                            </div>

                            <div class="addpet-field addpet-field-wide">
                                <label class="addpet-label" for="addpet-desc">Description</label>
                                <input class="addpet-input" type="text" id="addpet-desc" name="description" value="A very good boy who loves the park.">
                            </div>

                            <div class="addpet-actions">
                                <button class="addpet-btn addpet-btn-primary" type="submit">
                                    Save pet
                                </button>

                                <a class="addpet-btn addpet-btn-ghost" href="../MyPet/MyPet.html">
                                    Cancel
                                </a>
                            </div>

                        </div>
                    </form>
                </div>
            </main>
        </div>

    </div>
</body>
</html>
